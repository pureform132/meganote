name: Error
description: Algo no funciona como debería
title: "[Error] "
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportarlo. Cuanto más concreto sea, más rápido se arregla.
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué ocurre?
      description: Describe el comportamiento observado y el esperado.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir Takenotes
        2. Crear una página
        3. ...
    validations:
      required: true
  - type: dropdown
    id: plataforma
    attributes:
      label: Plataforma
      options:
        - Windows (Takenotes.exe)
        - Navegador (demo o build web)
        - Desde el código (npm run dev)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      description: La ves en la release o en el nombre del archivo descargado.
      placeholder: "1.0.0"
  - type: textarea
    id: extra
    attributes:
      label: Capturas o consola
      description: Arrastra imágenes aquí o pega el error de la consola (F12).
