<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Página no encontrada — MEGAnote</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root { --paper: #FDFCF8; --ink: #2E2A26; --terra: #C65D3B; --sage: #9AA88A; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--paper); color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif; text-align: center;
    }
    .card { max-width: 520px; }
    svg { width: 54px; height: 54px; margin-bottom: 20px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 46px; line-height: 1.05; margin: 0 0 14px; letter-spacing: -.02em; }
    h1 em { font-style: italic; color: var(--terra); }
    p { color: color-mix(in oklab, var(--ink) 64%, var(--paper)); font-size: 16px; line-height: 1.6; margin: 0 0 26px; }
    a {
      display: inline-block; background: color-mix(in oklab, var(--terra) 80%, var(--ink)); color: var(--paper);
      text-decoration: none; border-radius: 999px; padding: 12px 22px; font-weight: 600; font-size: 14px;
    }
    a:hover { background: color-mix(in oklab, var(--terra) 68%, var(--ink)); }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#FDFCF8" stroke="rgba(46,42,38,.16)"/>
      <path d="M9 22.5c2.6-.4 3.5-7.7 4.6-11.4.9-3 2.4-2.6 3.3.3.5 1.6 1 3.9 1.4 5.7" stroke="#2E2A26" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20.5 9.5h3.2M20.5 14h3.2M20.5 18.5h3.2" stroke="#C65D3B" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <h1>Esta página <em>no existe.</em></h1>
    <p>Puede que el enlace haya cambiado. Tu cuaderno sigue donde lo dejaste.</p>
    <a href="./">Volver a MEGAnote</a>
  </div>
</body>
</html>
